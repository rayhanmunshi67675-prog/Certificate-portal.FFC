<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #030611;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Initial Preloader */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #03050d;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .loader-container {
            position: relative;
            width: 160px;
            height: 160px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .orbit-ring-1 {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: #00f2fe;
            border-right-color: #0099ff;
            animation: rotateClockwise 1.5s linear infinite;
        }

        .orbit-ring-2 {
            position: absolute;
            width: 80%;
            height: 80%;
            border-radius: 50%;
            border: 2px solid transparent;
            border-bottom-color: #7928ca;
            border-left-color: #ff0080;
            animation: rotateCounter 1s linear infinite;
        }

        .loader-logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            z-index: 2;
        }

        /* Action Loader Overlay */
        #actionLoader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 5, 13, 0.85);
            backdrop-filter: blur(8px);
            z-index: 999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .spinner {
            width: 70px;
            height: 70px;
            border: 4px solid rgba(0, 210, 255, 0.1);
            border-top: 4px solid #00d2ff;
            border-radius: 50%;
            animation: rotateClockwise 1s linear infinite;
            margin-bottom: 20px;
        }

        .action-loader-text {
            color: #00d2ff;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        @keyframes rotateClockwise {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes rotateCounter {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }

        /* Success Toast Notification */
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            padding: 14px 28px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 15px;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
            z-index: 10000;
            transition: transform 0.4s ease, opacity 0.4s ease;
            opacity: 0;
            text-align: center;
        }

        #toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Main UI Layout */
        .top-bar {
            position: relative;
            z-index: 10;
            padding: 20px 30px;
        }

        .brand-logo {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid #00d2ff;
            object-fit: cover;
        }

        .main-wrapper {
            position: relative;
            z-index: 10;
            max-width: 900px;
            margin: 10px auto 50px auto;
            padding: 0 20px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 32px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #cbd5e1;
        }

        .glass-input, .glass-select {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 12px;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .glass-input:focus, .glass-select:focus {
            border-color: #00d2ff;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.3);
        }

        .glass-select option {
            background: #0f172a;
            color: #ffffff;
        }

        .btn-glow {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #00d2ff 0%, #0072ff 100%);
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
            text-transform: uppercase;
        }

        .btn-glow:hover {
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.7);
        }

        .canvas-container {
            margin-top: 25px;
            text-align: center;
        }

        canvas#certCanvas {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: none;
        }

        .btn-download {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.4);
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <!-- Preloader -->
    <div id="preloader">
        <div class="loader-container">
            <div class="orbit-ring-1"></div>
            <div class="orbit-ring-2"></div>
            <img src="logo.jpg" alt="Logo" class="loader-logo">
        </div>
    </div>

    <!-- Action Loader Overlay -->
    <div id="actionLoader">
        <div class="spinner"></div>
        <div class="action-loader-text">Generating Certificate...</div>
    </div>

    <!-- Success Toast Notification -->
    <div id="toast">🎉 Certificate Downloaded Successfully!</div>

    <div class="top-bar">
        <img src="logo.jpg" alt="Logo" class="brand-logo">
    </div>

    <div class="main-wrapper">
        <div class="page-header">
            <h1>Get Your Certificate</h1>
            <p style="color: #94a3b8;">আপনার নাম লিখে সার্টিফিকেট সংগ্রহ করুন</p>
        </div>

        <div class="glass-card">
            <div class="form-group">
                <label for="fullName">আপনার নাম লিখুন:</label>
                <input type="text" id="fullName" class="glass-input" placeholder="এখানে নাম টাইপ করুন...">
            </div>

            <div class="form-group">
                <label for="certType">সার্টিফিকেট ক্যাটাগরি সিলেক্ট করুন:</label>
                <select id="certType" class="glass-select">
                    <option value="participant">Participant Certificate</option>
                    <option value="ca">Campus Ambassador Certificate</option>
                </select>
            </div>

            <button class="btn-glow" onclick="generateCertificate()">Get Certificate</button>

            <div class="canvas-container">
                <canvas id="certCanvas"></canvas>
                <button id="downloadBtn" class="btn-glow btn-download" onclick="downloadCertificate()">Download Certificate</button>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_SHEET_SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE";

        window.addEventListener('load', () => {
            setTimeout(() => {
                const preloader = document.getElementById('preloader');
                preloader.style.opacity = '0';
                preloader.style.visibility = 'hidden';
            }, 1200);
        });

        // Background Particles
        const bgCanvas = document.getElementById('bgCanvas');
        const bgCtx = bgCanvas.getContext('2d');
        let particles = [];

        function resizeBg() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeBg);
        resizeBg();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * bgCanvas.width;
                this.y = Math.random() * bgCanvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedY = -(Math.random() * 0.6 + 0.2);
                this.opacity = Math.random() * 0.7 + 0.2;
            }
            update() {
                this.y += this.speedY;
                if (this.y < 0) { this.reset(); this.y = bgCanvas.height; }
            }
            draw() {
                bgCtx.fillStyle = `rgba(0, 210, 255, ${this.opacity})`;
                bgCtx.beginPath();
                bgCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                bgCtx.fill();
            }
        }

        for (let i = 0; i < 60; i++) { particles.push(new Particle()); }
        function animate() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        function generateUID() {
            const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            let randomStr = '';
            for (let i = 0; i < 6; i++) {
                randomStr += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return 'FFC-' + randomStr;
        }

        let currentUID = '';

        function generateCertificate() {
            const name = document.getElementById('fullName').value.trim();
            const certType = document.getElementById('certType').value;
            const canvas = document.getElementById('certCanvas');
            const ctx = canvas.getContext('2d');
            const downloadBtn = document.getElementById('downloadBtn');
            const actionLoader = document.getElementById('actionLoader');

            if (!name) {
                alert('দয়া করে আগে আপনার নাম লিখুন!');
                return;
            }

            actionLoader.style.display = 'flex';
            currentUID = generateUID();
            const imageSrc = certType === 'ca' ? 'certificate2.jpg' : 'certificate1.jpg';

            const img = new Image();
            img.src = imageSrc;

            img.onload = function () {
                canvas.width = img.width;
                canvas.height = img.height;

                ctx.drawImage(img, 0, 0);

                ctx.font = 'bold 52px "Cinzel", serif';
                ctx.fillStyle = '#111111';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                // Fixed Y coordinate so name sits precisely in the middle of the underline slot
                const x = canvas.width / 2;
                const y = canvas.height * 0.582; // Perfectly adjusted downward

                ctx.fillText(name.toUpperCase(), x, y);

                setTimeout(() => {
                    actionLoader.style.display = 'none';
                    canvas.style.display = 'block';
                    downloadBtn.style.display = 'block';
                    canvas.scrollIntoView({ behavior: 'smooth' });
                }, 800);

                sendDataToSheet(name, certType === 'ca' ? 'Campus Ambassador' : 'Participant', currentUID);
            };

            img.onerror = function() {
                actionLoader.style.display = 'none';
                alert(`ফাইলটি পাওয়া যায়নি! "${imageSrc}" ফাইলটি একই ফোল্ডারে আছে কিনা চেক করুন।`);
            }
        }

        function sendDataToSheet(name, type, uid) {
            if (GOOGLE_SHEET_SCRIPT_URL === "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE") return;

            fetch(GOOGLE_SHEET_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name: name, type: type, uid: uid })
            }).catch(err => console.error("Data Save Error:", err));
        }

        // Mobile-Friendly Download Handler with Toast Notification
        function downloadCertificate() {
            const name = document.getElementById('fullName').value.trim() || 'Certificate';
            const canvas = document.getElementById('certCanvas');

            canvas.toBlob(function(blob) {
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `${name}_Certificate.png`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);

                // Show Success Toast Notification
                showToast();
            }, 'image/png');
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }
    </script>
</body>
</html>
